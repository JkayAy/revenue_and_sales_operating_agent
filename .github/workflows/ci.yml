name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check packages apps/sales-api

      - name: Pytest
        run: pytest

      - name: Golden eval
        run: python -m eval

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and build dashboard
        working-directory: apps/dashboard
        env:
          NEXT_PUBLIC_SALES_API: http://localhost:8000
        run: |
          npm install
          npm run typecheck
          npm run build
