[project]
name = "sales-api"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
  "playbook-engine",
  "tools-hubspot",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.0",
  "email-validator>=2.0",
  "pyyaml>=6.0",
  "psycopg[binary]>=3.2",
  "httpx>=0.27",
]

[project.scripts]
sales-api = "sales_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sales_api"]
