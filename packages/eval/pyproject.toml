[project]
name = "sales-eval"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "playbook-engine",
]

[project.scripts]
sales-eval = "eval.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eval"]
